<html>
<head>
<style>
  @page {
    size: A4;
    margin: 2.2cm 2cm 2.4cm 2cm;
    background-color: {{BACKGROUND_COLOR}};
    @frame footer_frame {
      -pdf-frame-content: footer_content;
      bottom: 1cm;
      margin-left: 2cm;
      margin-right: 2cm;
      height: 1.2cm;
    }
  }
  body {
    font-family: {{FONT_FAMILY}};
    color: {{TEXT_COLOR}};
    background-color: {{BACKGROUND_COLOR}};
    font-size: 10pt;
    line-height: 1.5;
  }
  .header {
    margin-bottom: 18px;
  }
  .logo {
    max-height: 40px;
    margin-bottom: 12px;
  }
  h1 {
    color: {{PRIMARY_COLOR}};
    border-bottom: 2px solid {{ACCENT_COLOR}};
    padding-bottom: 6px;
    font-size: 20pt;
  }
  h2 {
    color: {{PRIMARY_COLOR}};
    font-size: 14pt;
    margin-top: 20px;
  }
  h3 {
    color: {{PRIMARY_COLOR}};
    font-size: 11pt;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0 16px 0;
  }
  th {
    background-color: {{PRIMARY_COLOR}};
    color: #ffffff;
    padding: 6px 8px;
    text-align: left;
    font-size: 9pt;
  }
  td {
    border-bottom: 1px solid #dddddd;
    padding: 6px 8px;
    font-size: 9pt;
  }
  code {
    background-color: #f2f2f2;
    padding: 1px 4px;
    font-family: Courier, monospace;
  }
  #footer_content {
    text-align: center;
    font-size: 7.5pt;
    color: #999999;
  }
</style>
</head>
<body>
  <div class="header">
    {{LOGO_HTML}}
  </div>
  {{BODY}}
  <div id="footer_content">{{COMPANY_NAME}} &mdash; {{FOOTER_TEXT}} &mdash; Page <pdf:pagenumber/></div>
</body>
</html>
